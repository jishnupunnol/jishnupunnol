<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Jishnu Sudhakaran - Security Researcher, MERN Developer, Game Developer, Accountant and Audit Assistant">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d12"/><stop offset=".6" stop-color="#10090b"/><stop offset="1" stop-color="#1a0a0d"/></linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#ffe3e3"/><stop offset="1" stop-color="#ff8589"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#E5484D" stop-opacity=".55"/><stop offset="1" stop-color="#E5484D" stop-opacity="0"/></radialGradient>
  <radialGradient id="fade" cx=".75" cy=".5" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E5484D" stop-opacity="0"/><stop offset="1" stop-color="#E5484D" stop-opacity=".35"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".07"/></pattern>
  <mask id="gridmask"><rect width="1000" height="360" fill="url(#fade)"/></mask>
  <clipPath id="frame"><rect x=".5" y=".5" width="999" height="359" rx="22"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1000" height="360" fill="url(#bg)"/>
  <rect width="1000" height="360" fill="url(#grid)" mask="url(#gridmask)"/>
  <circle cx="860" cy="60" r="260" fill="url(#glow)" opacity=".5">
    <animate attributeName="cx" values="860;780;860" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;120;60" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="400" r="200" fill="url(#glow)" opacity=".22">
    <animate attributeName="cx" values="120;220;120" dur="17s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(840 180)" fill="none" stroke="#E5484D">
    <circle r="50" stroke-opacity=".28"/><circle r="100" stroke-opacity=".2"/><circle r="150" stroke-opacity=".13"/>
    <path d="M-150 0H150M0 -150V150" stroke-opacity=".1"/>
    <g>
      <path d="M0 0L150 0A150 150 0 0 0 106.07 -106.07Z" fill="url(#sweep)" stroke="none"/>
      <path d="M0 0L150 0" stroke-opacity=".7"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
    </g>
    <g fill="#ff8589" stroke="none">
      <circle cx="62" cy="-48" r="4"><animate attributeName="opacity" values="0;1;0" dur="7s" begin="5.9s" repeatCount="indefinite"/></circle>
      <circle cx="-70" cy="58" r="4"><animate attributeName="opacity" values="0;1;0" dur="7s" begin="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="-30" cy="-110" r="3.5"><animate attributeName="opacity" values="0;1;0" dur="7s" begin="4.6s" repeatCount="indefinite"/></circle>
      <circle r="4" fill="#E5484D"/>
    </g>
  </g>
  <circle cx="62" cy="74" r="5" fill="#E5484D"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="78" y="79" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="2" fill="#9da7b3">SECURITY RESEARCHER / MERN DEVELOPER / GAME DEVELOPER / ACCOUNTANT</text>
  <text x="54" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Jishnu Sudhakaran</text>
  <text x="56" y="204" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#9da7b3">I break things to make them safer, and build things people enjoy.</text>
  <text x="56" y="268" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#6e7681"><tspan fill="#E5484D">~ $</tspan> whoami --highlights</text>
  <clipPath id="t0"><rect x="56" y="282" width="0" height="30"><animate attributeName="width" begin="0s" dur="24s" repeatCount="indefinite" values="0;343;343;0;0" keyTimes="0;0.067;0.157;0.163;1"/></rect></clipPath><text clip-path="url(#t0)" x="56" y="304" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#ff8589">microsoft &amp; google hall of fame</text><clipPath id="t1"><rect x="56" y="282" width="0" height="30"><animate attributeName="width" begin="4s" dur="24s" repeatCount="indefinite" values="0;374;374;0;0" keyTimes="0;0.067;0.157;0.163;1"/></rect></clipPath><text clip-path="url(#t1)" x="56" y="304" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#ff8589">recognized by the dutch government</text><clipPath id="t2"><rect x="56" y="282" width="0" height="30"><animate attributeName="width" begin="8s" dur="24s" repeatCount="indefinite" values="0;480;480;0;0" keyTimes="0;0.067;0.157;0.163;1"/></rect></clipPath><text clip-path="url(#t2)" x="56" y="304" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#ff8589">building brahmastra scanner -&gt; brahmastra.me</text><clipPath id="t3"><rect x="56" y="282" width="0" height="30"><animate attributeName="width" begin="12s" dur="24s" repeatCount="indefinite" values="0;480;480;0;0" keyTimes="0;0.067;0.157;0.163;1"/></rect></clipPath><text clip-path="url(#t3)" x="56" y="304" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#ff8589">red-teaming ai &amp; llm apps (owasp llm top 10)</text><clipPath id="t4"><rect x="56" y="282" width="0" height="30"><animate attributeName="width" begin="16s" dur="24s" repeatCount="indefinite" values="0;374;374;0;0" keyTimes="0;0.067;0.157;0.163;1"/></rect></clipPath><text clip-path="url(#t4)" x="56" y="304" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#ff8589">mern stack / unity / unreal engine</text><clipPath id="t5"><rect x="56" y="282" width="0" height="30"><animate attributeName="width" begin="20s" dur="24s" repeatCount="indefinite" values="0;311;311;0;0" keyTimes="0;0.067;0.157;0.163;1"/></rect></clipPath><text clip-path="url(#t5)" x="56" y="304" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#ff8589">accountant &amp; audit assistant</text>
</g>
<rect x=".5" y=".5" width="999" height="359" rx="22" fill="none" stroke="#30363d"/>
</svg>
